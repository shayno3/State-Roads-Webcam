<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>StateRoad.fyi — Camera View</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
    #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
    #cam{width:100%;height:100%;object-fit:contain;display:block}
    #hud{
      position:fixed;bottom:0;left:0;right:0;
      display:flex;align-items:center;justify-content:space-between;
      padding:6px 12px;
      background:rgba(0,0,0,0.65);
      font-size:11px;color:rgba(255,255,255,0.55);
      letter-spacing:0.5px;gap:8px;
    }
    #back{color:rgba(255,255,255,0.4);text-decoration:none;flex-shrink:0;}
    #back:hover{color:#fff}
    #title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center;}
    #hud-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    #updated{color:rgba(255,255,255,0.35);font-size:10px;}
    #timer{color:#F5C318;}
    #overlay{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#000;font-size:13px;color:rgba(255,255,255,0.4);
    }
    .spin{
      width:24px;height:24px;border:2px solid rgba(255,255,255,0.15);
      border-top-color:#F5C318;border-radius:50%;
      animation:sp 0.7s linear infinite;margin-right:10px;
    }
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div id="wrap">
  <img id="cam" alt="Camera feed"/>
  <div id="overlay"><div class="spin"></div>Loading…</div>
</div>
<div id="hud">
  <a id="back" href="/">← Back</a>
  <span id="title">—</span>
  <div id="hud-right">
    <span id="updated"></span>
    <span id="timer">⟳ 30s</span>
  </div>
</div>
<script>
  const params     = new URLSearchParams(location.search);
  const encodedUrl = params.get('url') || '';
  const title      = params.get('title') || 'Camera Feed';
  const RATE       = parseInt(params.get('rate') || '30');
  const source     = params.get('source') || '';
  const camId      = params.get('id') || '';
  const isFL       = source === 'fl' && camId;

  document.getElementById('title').textContent = title;

  let countdown    = RATE;
  let currentImgUrl = encodedUrl;          // may be updated by FL lookup
  const timerEl   = document.getElementById('timer');
  const updatedEl = document.getElementById('updated');
  const overlay   = document.getElementById('overlay');
  const img       = document.getElementById('cam');

  // Show "Updated Xs ago" from ArcGIS TIMESTAMP (epoch ms)
  function showUpdated(tsMs) {
    if (!tsMs) { updatedEl.textContent = ''; return; }
    const age = Math.round((Date.now() - tsMs) / 1000);
    if (age < 60)        updatedEl.textContent = `cam ${age}s ago`;
    else if (age < 3600) updatedEl.textContent = `cam ${Math.round(age/60)}m ago`;
    else                 updatedEl.textContent = `cam ${Math.round(age/3600)}h ago`;
  }

  function loadImage(imgUrl) {
    overlay.style.display = 'flex';
    img.onload  = () => { overlay.style.display = 'none'; };
    img.onerror = () => { overlay.innerHTML = '⚠️ Feed unavailable'; };
    img.src = '/api/image?url=' + encodeURIComponent(decodeURIComponent(imgUrl)) + '&t=' + Date.now();
    countdown = RATE;
  }

  // For FL cameras: fetch fresh IMAGE url + timestamp from ArcGIS via server proxy
  async function refreshFL() {
    try {
      const res  = await fetch(`/api/camera/fl/${encodeURIComponent(camId)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.imageUrl) currentImgUrl = encodeURIComponent(data.imageUrl);
      showUpdated(data.timestamp);
    } catch (e) {
      console.warn('FL refresh failed:', e.message);
    }
    loadImage(currentImgUrl);
  }

  // Main tick: decrement countdown, reload when it hits 0
  function tick() {
    countdown--;
    timerEl.textContent = '⟳ ' + countdown + 's';
    if (countdown <= 0) {
      if (isFL) refreshFL(); else loadImage(currentImgUrl);
    }
  }

  // Kick off
  if (encodedUrl || isFL) {
    if (isFL) refreshFL(); else loadImage(currentImgUrl);
    setInterval(tick, 1000);
  } else {
    overlay.innerHTML = '⚠️ No camera URL';
  }
</script>
</body>
</html>
