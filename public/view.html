<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>StateRoad.fyi — Camera View</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
    #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
    #cam{width:100%;height:100%;object-fit:contain;display:block}
    #hud{
      position:fixed;bottom:0;left:0;right:0;
      display:flex;align-items:center;justify-content:space-between;
      padding:6px 12px;
      background:rgba(0,0,0,0.65);
      font-size:11px;color:rgba(255,255,255,0.55);
      letter-spacing:0.5px;
    }
    #title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;}
    #timer{color:#F5C318;flex-shrink:0;}
    #back{color:rgba(255,255,255,0.4);text-decoration:none;flex-shrink:0;}
    #back:hover{color:#fff}
    #overlay{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#000;font-size:13px;color:rgba(255,255,255,0.4);
    }
    .spin{
      width:24px;height:24px;border:2px solid rgba(255,255,255,0.15);
      border-top-color:#F5C318;border-radius:50%;
      animation:spin 0.7s linear infinite;margin-right:10px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div id="wrap">
  <img id="cam" alt="Camera feed"/>
  <div id="overlay"><div class="spin"></div>Loading…</div>
</div>
<div id="hud">
  <a id="back" href="/">← Back</a>
  <span id="title">—</span>
  <span id="timer">⟳ 30s</span>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const encodedUrl = params.get('url') || '';
  const title = params.get('title') || 'Camera Feed';
  const RATE = parseInt(params.get('rate') || '30');

  document.getElementById('title').textContent = title;

  let countdown = RATE;
  const timerEl = document.getElementById('timer');
  const overlay = document.getElementById('overlay');
  const img = document.getElementById('cam');

  function loadImage() {
    overlay.style.display = 'flex';
    img.onload  = () => { overlay.style.display = 'none'; };
    img.onerror = () => { overlay.innerHTML = '⚠️ Feed unavailable'; };
    img.src = '/api/image?url=' + encodedUrl + '&t=' + Date.now();
    countdown = RATE;
  }

  if (encodedUrl) {
    loadImage();
    setInterval(() => {
      countdown--;
      timerEl.textContent = '⟳ ' + countdown + 's';
      if (countdown <= 0) loadImage();
    }, 1000);
  } else {
    overlay.innerHTML = '⚠️ No camera URL';
  }
</script>
</body>
</html>
