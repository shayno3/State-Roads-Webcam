<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StateRoad.fyi — Live Road Cameras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset & Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080A10;
      --surface:   #0F1220;
      --surface2:  #171B2C;
      --border:    #1E2438;
      --text:      #E2E6F4;
      --muted:     #515A72;
      --accent:    #F5C318;
      --accent-dim:rgba(245,195,24,0.10);
      --live:      #3CB878;
      --live-dim:  rgba(60,184,120,0.12);
      --offline:   #E04545;
      --font-ui:   'Inter', system-ui, sans-serif;
      --font-head: 'Barlow Condensed', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --tab-h:     54px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      overflow: hidden;
    }

    /* ─── App Shell ─────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── Header ────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      padding: 0 12px;
      height: 46px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 27px;
      height: 27px;
      background: var(--accent);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg { display: block; }

    .logo-name {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.3px;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1;
    }

    .logo-tld { color: var(--accent); }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--live-dim);
      border: 1px solid rgba(60,184,120,0.22);
      border-radius: 20px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--live);
      letter-spacing: 0.5px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 2s infinite;
    }

    /* ─── State Selector ────────────────────────────────────────── */
    #state-selector-wrap {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 12px 8px;
      flex-shrink: 0;
      position: relative;
      z-index: 100;
    }

    #state-trigger {
      width: 100%;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    #state-trigger.has-states {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    #state-trigger:hover, #state-trigger.open {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    #state-trigger-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    #state-count-badge {
      background: rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* chips row */
    #chips-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    #chips-row::-webkit-scrollbar { display: none; }
    #chips-row.hidden { display: none; }

    .chip {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.5px;
      padding: 2px 6px 2px 8px;
      border-radius: 3px;
      background: var(--accent);
      color: #000;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      transition: opacity 0.12s;
    }
    .chip:hover { opacity: 0.72; }
    .chip-x { font-size: 9px; opacity: 0.6; font-weight: 900; }

    /* ─── Dropdown Panel ────────────────────────────────────────── */
    .dropdown-panel {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      max-height: 360px;
      overflow-y: auto;
      z-index: 200;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .dropdown-panel.hidden { display: none; }

    .dropdown-header {
      padding: 10px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    #dd-search {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
    }
    #dd-search:focus { border-color: var(--accent); }
    #dd-search::placeholder { color: var(--muted); }

    .dd-actions { display: flex; gap: 8px; }
    .dd-actions button {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }
    .dd-actions button:hover { border-color: var(--accent); color: var(--accent); }

    .region-group { padding: 6px 12px 3px; }
    .region-label {
      font-family: var(--font-head);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .state-check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 8px;
      transition: opacity 0.1s;
    }
    .state-check-row:last-child { border-bottom: none; }
    .state-check-row:hover { opacity: 0.8; }
    .scr-left { display: flex; align-items: center; gap: 10px; }
    .scr-code { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--text); width: 40px; }
    .scr-label { font-size: 13px; color: var(--muted); }
    .scr-box {
      width: 18px; height: 18px; border-radius: 3px;
      border: 1.5px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.12s;
    }
    .scr-box.checked { background: var(--accent); border-color: var(--accent); }
    .scr-box.checked::after { content: '✓'; font-size: 11px; color: #000; font-weight: 900; }

    /* ─── FL/IA Filter Bar ──────────────────────────────────────── */
    #fl-filter-bar {
      display: flex;
      gap: 5px;
      padding: 5px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
      align-items: center;
    }
    #fl-filter-bar::-webkit-scrollbar { display: none; }
    #fl-filter-bar.hidden { display: none; }

    .fl-bar-label {
      font-family: var(--font-head);
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--muted);
      flex-shrink: 0; padding-right: 3px;
    }

    .county-chip {
      font-family: var(--font-head); font-weight: 700; font-size: 10px;
      letter-spacing: 0.5px; padding: 3px 8px; border-radius: 3px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--muted); cursor: pointer; white-space: nowrap;
      flex-shrink: 0; transition: all 0.12s;
      display: flex; align-items: center; gap: 3px;
    }
    .county-chip:hover { border-color: var(--accent); color: var(--accent); }
    .county-chip.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .county-chip .cc-count { font-size: 9px; opacity: 0.6; }

    /* ─── Status Strip ──────────────────────────────────────────── */
    #status-bar {
      padding: 3px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 9px; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0; letter-spacing: 0.3px;
    }
    .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--live); animation: pulse 2s infinite; flex-shrink: 0;
    }
    .status-dot.loading { background: var(--accent); }
    .status-dot.error   { background: var(--offline); animation: none; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ─── Content ───────────────────────────────────────────────── */
    #content { flex: 1; overflow: hidden; position: relative; }

    .view { position: absolute; inset: 0; overflow-y: auto; display: none; }
    .view.active { display: block; }

    /* ─── Bottom Tab Bar ────────────────────────────────────────── */
    .tab-bar {
      height: var(--tab-h);
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-bar.hidden { display: none; }

    .tab-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      color: var(--muted); transition: color 0.15s; padding: 0;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn:hover  { color: var(--text); }

    .tab-icon  { font-size: 18px; line-height: 1; }
    .tab-label {
      font-family: var(--font-head); font-size: 9px;
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    }

    /* ─── List View ─────────────────────────────────────────────── */
    #list-view { padding: 8px; }

    .search-row { display: flex; gap: 7px; margin-bottom: 7px; }

    #search-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-family: var(--font-ui);
      font-size: 12px; padding: 7px 11px; outline: none; transition: border-color 0.15s;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-input:focus { border-color: var(--accent); }

    .view-toggle-btn {
      width: 34px; height: 34px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface); color: var(--muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; transition: color 0.15s, border-color 0.15s;
    }
    .view-toggle-btn:hover { color: var(--accent); border-color: var(--accent); }

    .count-badge {
      font-family: var(--font-mono); font-size: 9px;
      color: var(--muted); margin-bottom: 7px; letter-spacing: 0.3px;
    }

    .camera-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    /* ─── Camera Card ────────────────────────────────────────────── */
    .camera-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; overflow: hidden; cursor: pointer;
      transition: border-color 0.15s; position: relative;
    }
    .camera-card:hover { border-color: rgba(245,195,24,0.45); }

    .camera-thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: var(--surface2); overflow: hidden;
    }

    .camera-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }

    .camera-thumb-placeholder {
      width: 100%; height: 100%; display: flex;
      align-items: center; justify-content: center; color: var(--muted); font-size: 20px;
    }

    .cam-status-dot {
      position: absolute; top: 5px; right: 5px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--live); border: 1.5px solid rgba(0,0,0,0.5); z-index: 3;
    }
    .cam-status-dot.offline { background: var(--offline); }
    .cam-status-dot.online  { animation: pulse 2s infinite; }

    .cam-id-tag {
      position: absolute; bottom: 4px; left: 4px;
      font-family: var(--font-mono); font-size: 7.5px;
      color: rgba(255,255,255,0.48); background: rgba(0,0,0,0.55);
      padding: 1px 4px; border-radius: 2px; z-index: 3; letter-spacing: 0.3px;
    }

    .surface-badge {
      position: absolute; bottom: 4px; right: 4px;
      font-family: var(--font-mono); font-size: 7px; font-weight: 500;
      letter-spacing: 0.4px; padding: 1px 4px; border-radius: 2px;
      z-index: 4; text-transform: uppercase; line-height: 1.7; pointer-events: none;
    }
    .surface-badge.dry   { background: rgba(60,184,120,0.9);  color: #000; }
    .surface-badge.wet   { background: rgba(74,158,232,0.9);  color: #000; }
    .surface-badge.ice   { background: rgba(0,212,240,0.9);   color: #000; }
    .surface-badge.snow  { background: rgba(200,220,255,0.9); color: #111; }
    .surface-badge.other { background: rgba(80,88,112,0.85);  color: #fff; }

    .camera-info { padding: 5px 8px 7px; }

    .camera-source {
      font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 1px;
    }

    .camera-road {
      font-family: var(--font-head); font-weight: 700; font-size: 12px;
      color: var(--accent); text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .camera-location {
      font-size: 10.5px; color: var(--text); opacity: 0.78;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ─── Detail View ───────────────────────────────────────────── */
    #detail-view { background: #000; flex-direction: column; }
    #detail-view.active { display: flex; }

    .detail-header {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: rgba(8,10,16,0.96); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }

    .back-btn {
      width: 30px; height: 30px; border-radius: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
    }

    .detail-title { flex: 1; min-width: 0; }

    .detail-road {
      font-family: var(--font-head); font-weight: 700; font-size: 13px;
      color: var(--accent); text-transform: uppercase; letter-spacing: 1px;
    }

    .detail-location {
      font-size: 12px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85;
    }

    .refresh-info {
      font-family: var(--font-mono); font-size: 10px;
      color: var(--muted); text-align: right; flex-shrink: 0;
    }

    .detail-image-wrap {
      flex: 1; position: relative; background: #000;
      display: flex; align-items: center; justify-content: center;
      min-height: 200px; overflow: hidden;
    }

    #detail-img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .img-overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); font-size: 13px; color: var(--muted); z-index: 10;
    }
    .img-overlay.visible { display: flex; }

    .refresh-badge {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(8,10,16,0.85); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 8px;
      font-family: var(--font-mono); font-size: 9px;
      color: var(--muted); backdrop-filter: blur(4px); z-index: 5;
    }

    .detail-meta {
      padding: 9px 12px; background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; flex-shrink: 0;
    }

    .meta-item { text-align: center; }
    .meta-label {
      font-family: var(--font-mono); font-size: 8px;
      text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 3px;
    }
    .meta-value { font-size: 12px; font-weight: 600; color: var(--text); }

    .detail-controls {
      display: flex; gap: 7px; padding: 9px 12px;
      background: var(--surface); flex-shrink: 0;
    }

    .ctrl-btn {
      flex: 1; padding: 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-family: var(--font-ui); font-size: 11px;
      cursor: pointer; text-align: center; transition: opacity 0.15s;
    }
    .ctrl-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .ctrl-btn:hover { opacity: 0.82; }

    .detail-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(8,10,16,0.80); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      font-size: 16px; z-index: 10; backdrop-filter: blur(4px);
    }
    #nav-prev { left: 8px; }
    #nav-next { right: 8px; }

    /* ── Settings View ─────────────────────────────── */
    .settings-section {
      padding: 14px 14px 4px;
    }
    .settings-label {
      font-family: var(--font-ui); font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); margin-bottom: 8px;
    }
    .settings-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; margin-bottom: 12px;
    }
    .settings-row {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 13px; border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-label {
      flex: 1; font-size: 13px; color: var(--text);
    }
    .settings-row-sub {
      font-size: 10px; color: var(--muted); margin-top: 1px;
    }
    .settings-input {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-family: var(--font-mono);
      font-size: 11px; padding: 5px 8px; width: 160px;
    }
    .settings-input:focus { outline: none; border-color: var(--accent); }
    .settings-toggle {
      width: 38px; height: 22px; border-radius: 11px;
      background: var(--border); border: none; cursor: pointer;
      position: relative; transition: background 0.2s; flex-shrink: 0;
    }
    .settings-toggle.on { background: var(--accent); }
    .settings-toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; transition: left 0.2s;
    }
    .settings-toggle.on::after { left: 19px; }
    .settings-save-btn {
      margin: 6px 14px 14px; width: calc(100% - 28px);
      padding: 11px; border-radius: 8px;
      background: var(--accent); border: none;
      color: #000; font-family: var(--font-ui); font-size: 13px;
      font-weight: 700; cursor: pointer; transition: opacity 0.15s;
    }
    .settings-save-btn:hover { opacity: 0.85; }
    .about-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 13px;
    }
    .about-app { font-size: 13px; font-weight: 600; color: var(--text); }
    .about-version { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

    /* ── Weather / Conditions View ──────────────────── */
    .weather-header {
      padding: 12px 14px 6px;
      font-family: var(--font-head); font-size: 18px;
      font-weight: 700; color: var(--text); letter-spacing: 0.3px;
    }
    .weather-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; padding: 0 14px 14px;
    }
    .wx-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 12px;
    }
    .wx-card-station {
      font-size: 10px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .wx-card-temp {
      font-family: var(--font-head); font-size: 28px;
      font-weight: 700; color: var(--text); margin: 4px 0 2px;
      letter-spacing: -0.5px;
    }
    .wx-card-desc {
      font-size: 11px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .wx-card-wind {
      font-size: 10px; color: var(--muted); margin-top: 5px;
      font-family: var(--font-mono);
    }
    .wx-card-updated {
      font-size: 9px; color: var(--muted); margin-top: 3px;
      font-family: var(--font-mono); opacity: 0.7;
    }
    .wx-no-data {
      grid-column: 1 / -1; text-align: center;
      padding: 30px 0; color: var(--muted); font-size: 13px;
    }

    /* ── Shared Utilities ───────────────────────────── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px;
      color: var(--muted); text-align: center;
    }
    .empty-state-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state-msg  { font-size: 14px; line-height: 1.5; }

    .spinner {
      width: 28px; height: 28px; margin: 40px auto;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      position: fixed; bottom: calc(var(--tab-h) + 12px); left: 50%;
      transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; padding: 7px 14px;
      border-radius: 20px; z-index: 9999; opacity: 0;
      transition: opacity 0.25s; pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #toast.detail-mode { bottom: 12px; }

    /* ── Scrollbar ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Hidden / Utility ───────────────────────────── */
    .hidden { display: none !important; }
    .has-states #state-trigger-arrow { transform: rotate(180deg); }

  </style>
</head>
<body>
<div id="app">

  <!-- ── Header ──────────────────────────────────────── -->
  <header id="app-header">
    <div class="logo">
      <span class="logo-mark">◈</span>
      <span class="logo-name">StateRoad</span>
    </div>
    <span class="live-badge" id="live-badge">● LIVE</span>
  </header>

  <!-- ── State Selector Row ───────────────────────────── -->
  <div id="state-selector-wrap">
    <button id="state-trigger" onclick="toggleDropdown()">
      <span class="state-trigger-label" id="state-trigger-label">Select States</span>
      <span class="state-trigger-count hidden" id="state-trigger-count"></span>
      <span id="state-trigger-arrow">▾</span>
    </button>

    <!-- Dropdown Panel -->
    <div id="dropdown-panel" class="dropdown-panel hidden">
      <div class="dropdown-header">
        <input class="dd-search" id="dd-search" type="text"
               placeholder="Search states…" oninput="filterDropdown(this.value)">
        <div class="dd-actions">
          <button onclick="selectAllStates()">All</button>
          <button onclick="clearAllStates()">Clear</button>
        </div>
      </div>
      <div id="dd-list"><!-- region groups injected by JS --></div>
    </div>
  </div><!-- /state-selector-wrap -->

  <!-- ── Active-State Chips Row ───────────────────────── -->
  <div id="chips-row" class="hidden"></div>

  <!-- ── FL / IA Filter Bar ───────────────────────────── -->
  <div id="fl-filter-bar" class="hidden">
    <div class="fl-filter-inner" id="fl-filter-inner">
      <!-- district/county chips injected by JS -->
    </div>
  </div>

  <!-- ── Status Bar ───────────────────────────────────── -->
  <div id="status-bar" class="status-strip">
    <span id="status-text">Loading cameras…</span>
  </div>

  <!-- ── Content Area ────────────────────────────────── -->
  <div id="content">

    <!-- List View -->
    <div id="list-view" class="view active">
      <div class="search-row">
        <input id="search-input" class="search-input" type="text"
               placeholder="Search cameras…" oninput="filterCameras()">
        <button class="view-toggle-btn" id="view-toggle-btn"
                onclick="toggleGridMode()" title="Toggle grid/list">⊞</button>
      </div>
      <div class="count-badge" id="count-badge"></div>
      <div id="camera-grid" class="camera-grid"></div>
    </div>

    <!-- Detail View -->
    <div id="detail-view" class="view">
      <div class="detail-header">
        <button class="back-btn" onclick="showTab('list')">← Back</button>
        <div>
          <div class="detail-title" id="detail-title">Camera</div>
          <div class="detail-road" id="detail-road"></div>
          <div class="detail-location" id="detail-location"></div>
        </div>
        <span class="refresh-info" id="refresh-info"></span>
      </div>
      <div class="detail-image-wrap">
        <img id="detail-img" class="detail-img" src="" alt="Camera feed">
        <div class="img-overlay" id="img-overlay">
          <span class="refresh-badge" id="refresh-badge">Live</span>
        </div>
        <button class="detail-nav" id="nav-prev" onclick="navigateCamera(-1)">‹</button>
        <button class="detail-nav" id="nav-next" onclick="navigateCamera(1)">›</button>
      </div>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-controls">
        <button class="ctrl-btn" onclick="refreshDetail()">↻ Refresh</button>
        <button class="ctrl-btn" onclick="copyDetailLink()">⎘ Copy Link</button>
        <button class="ctrl-btn primary" onclick="openFullImage()">Full ↗</button>
      </div>
    </div><!-- /detail-view -->

    <!-- Settings View -->
    <div id="settings-view" class="view">
      <div class="settings-section">
        <div class="settings-label">API Keys</div>
        <div class="settings-card">
          <div class="settings-row">
            <div class="settings-row-label">
              ibi511 Key
              <div class="settings-row-sub">Required for ibi511 states</div>
            </div>
            <input class="settings-input" id="ibi-key-input"
                   type="password" placeholder="Enter key…">
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Display</div>
        <div class="settings-card">
          <div class="settings-row">
            <div class="settings-row-label">
              Grid Mode
              <div class="settings-row-sub">Show cameras in grid layout</div>
            </div>
            <button class="settings-toggle" id="grid-toggle"
                    onclick="toggleGridPref()"></button>
          </div>
        </div>
      </div>
      <button class="settings-save-btn" onclick="saveKeys()">Save &amp; Load Cameras</button>

      <div class="settings-section">
        <div class="settings-label">About</div>
        <div class="settings-card">
          <div class="about-row">
            <div class="about-app">StateRoad.fyi</div>
            <div class="about-version">v1.4.0</div>
          </div>
        </div>
      </div>
    </div><!-- /settings-view -->

    <!-- Weather / Conditions View -->
    <div id="weather-view" class="view">
      <div class="weather-header">Road Conditions</div>
      <div class="weather-grid" id="weather-grid">
        <div class="wx-no-data">
          <div class="spinner"></div>
        </div>
      </div>
    </div><!-- /weather-view -->

  </div><!-- /content -->

  <!-- ── Bottom Tab Bar ───────────────────────────────── -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn active" id="tab-cameras" onclick="showTab('list')">
      <span class="tab-icon">📷</span>
      <span class="tab-label">Cameras</span>
    </button>
    <button class="tab-btn" id="tab-conditions" onclick="showTab('weather')">
      <span class="tab-icon">🌡</span>
      <span class="tab-label">Conditions</span>
    </button>
    <button class="tab-btn" id="tab-settings" onclick="showTab('settings')">
      <span class="tab-icon">⚙</span>
      <span class="tab-label">Settings</span>
    </button>
  </nav>

  <!-- Toast -->
  <div id="toast"></div>

</div><!-- /app -->

<script>
'use strict';

/* ── Constants ─────────────────────────────────────── */
const REGIONS = {
  'Northwest': ['ak','id','mt','or','wa'],
  'Southwest': ['az','ca','co','nv','nm','ut'],
  'Midwest':   ['ia','il','in','ks','mi','mn','mo','nd','ne','oh','sd','wi'],
  'South':     ['al','ar','fl','ga','ky','la','ms','nc','ok','sc','tn','tx'],
  'Northeast': ['ct','dc','de','ma','md','me','nh','nj','ny','pa','ri','va','vt','wv'],
  'Other':     ['wy']
};

const STATE_NAMES = {
  ak:'Alaska', al:'Alabama', ar:'Arkansas', az:'Arizona', ca:'California',
  co:'Colorado', ct:'Connecticut', dc:'DC', de:'Delaware', fl:'Florida',
  ga:'Georgia', ia:'Iowa', id:'Idaho', il:'Illinois', in:'Indiana',
  ks:'Kansas', ky:'Kentucky', la:'Louisiana', ma:'Massachusetts', md:'Maryland',
  me:'Maine', mi:'Michigan', mn:'Minnesota', mo:'Missouri', ms:'Mississippi',
  mt:'Montana', nc:'North Carolina', nd:'North Dakota', ne:'Nebraska',
  nh:'New Hampshire', nj:'New Jersey', nm:'New Mexico', nv:'Nevada',
  ny:'New York', oh:'Ohio', ok:'Oklahoma', or:'Oregon', pa:'Pennsylvania',
  ri:'Rhode Island', sc:'South Carolina', sd:'South Dakota', tn:'Tennessee',
  tx:'Texas', ut:'Utah', va:'Virginia', vt:'Vermont', wa:'Washington',
  wi:'Wisconsin', wv:'West Virginia', wy:'Wyoming'
};

// Source type per state
const IBI511_STATES   = ['co','id','in','ks','mn','mo','mt','nc','nd','ne','nm','oh','ok','or','sd','tn','wy'];
const WSDOT_STATES    = ['wa'];
const FL_STATES       = ['fl'];
const IA_STATES       = ['ia'];
const WEATHER_STATES  = ['ak','id','la','ne','nh','nv','ny','pa','ut','va','vt','wi'];

/* ── App State ─────────────────────────────────────── */
let selectedStates  = [];
let allCameras      = [];
let filteredCameras = [];
let currentCamera   = null;
let currentIndex    = 0;
let isGridMode      = false;
let activeTab       = 'list';
let ibiKey          = '';
let toastTimer      = null;
let dropdownOpen    = false;

/* ── Tab / View Management ─────────────────────────── */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(name + '-view');
  if (el) el.classList.add('active');
}

function showTab(name) {
  activeTab = name;
  showView(name);
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const tabMap = { list: 'tab-cameras', weather: 'tab-conditions', settings: 'tab-settings' };
  if (tabMap[name]) document.getElementById(tabMap[name])?.classList.add('active');
  document.getElementById('tab-bar').classList.remove('hidden');
  document.getElementById('toast').classList.remove('detail-mode');
}

/* ── Dropdown / State Selector ─────────────────────── */
function buildDropdown() {
  const list = document.getElementById('dd-list');
  list.innerHTML = '';
  for (const [region, states] of Object.entries(REGIONS)) {
    const grp = document.createElement('div');
    grp.className = 'region-group';
    grp.innerHTML = `<div class="region-label">${region}</div>`;
    states.forEach(code => {
      const row = document.createElement('div');
      row.className = 'scr' + (selectedStates.includes(code) ? ' checked' : '');
      row.dataset.state = code;
      row.innerHTML = `<span class="scr-box">${selectedStates.includes(code) ? '✓' : ''}</span>
        <span class="scr-name">${STATE_NAMES[code] || code.toUpperCase()}</span>
        <span class="scr-code">${code.toUpperCase()}</span>`;
      row.addEventListener('click', () => toggleStateCheck(code));
      grp.appendChild(row);
    });
    list.appendChild(grp);
  }
}

function toggleDropdown() {
  dropdownOpen = !dropdownOpen;
  const panel = document.getElementById('dropdown-panel');
  const trigger = document.getElementById('state-trigger');
  if (dropdownOpen) {
    panel.classList.remove('hidden');
    trigger.classList.add('has-states');
    buildDropdown();
  } else {
    panel.classList.add('hidden');
    trigger.classList.remove('has-states');
  }
}

function filterDropdown(q) {
  document.querySelectorAll('.scr').forEach(row => {
    const name = row.querySelector('.scr-name').textContent.toLowerCase();
    const code = row.dataset.state;
    row.style.display = (name.includes(q.toLowerCase()) || code.includes(q.toLowerCase())) ? '' : 'none';
  });
  document.querySelectorAll('.region-group').forEach(grp => {
    const visible = [...grp.querySelectorAll('.scr')].some(r => r.style.display !== 'none');
    grp.style.display = visible ? '' : 'none';
  });
}

function toggleStateCheck(code) {
  if (selectedStates.includes(code)) {
    selectedStates = selectedStates.filter(s => s !== code);
  } else {
    selectedStates.push(code);
  }
  saveSelectedStates();
  buildDropdown();
  renderChips();
  loadAllCameras();
}

function selectAllStates() {
  selectedStates = Object.values(REGIONS).flat();
  saveSelectedStates(); buildDropdown(); renderChips(); loadAllCameras();
}

function clearAllStates() {
  selectedStates = [];
  saveSelectedStates(); buildDropdown(); renderChips(); loadAllCameras();
}

function saveSelectedStates() {
  try { localStorage.setItem('selectedStates', JSON.stringify(selectedStates)); } catch(e){}
}
function loadSelectedStates() {
  try { return JSON.parse(localStorage.getItem('selectedStates') || '[]'); } catch(e){ return []; }
}

/* ── Chips Row ─────────────────────────────────────── */
function renderChips() {
  const row = document.getElementById('chips-row');
  const label = document.getElementById('state-trigger-label');
  const countBadge = document.getElementById('state-trigger-count');
  if (!selectedStates.length) {
    row.innerHTML = '';
    row.classList.add('hidden');
    label.textContent = 'Select States';
    countBadge.classList.add('hidden');
    return;
  }
  label.textContent = selectedStates.length === 1
    ? (STATE_NAMES[selectedStates[0]] || selectedStates[0].toUpperCase())
    : 'States';
  countBadge.textContent = selectedStates.length;
  countBadge.classList.remove('hidden');
  row.innerHTML = selectedStates.map(code =>
    `<span class="chip" onclick="removeChip('${code}')">${code.toUpperCase()} ×</span>`
  ).join('');
  row.classList.remove('hidden');
}

function removeChip(code) {
  selectedStates = selectedStates.filter(s => s !== code);
  saveSelectedStates(); renderChips(); loadAllCameras();
}

/* ── FL District Filter ───────────────────────────── */
let flDistrict = null;
function buildFlFilter(cameras) {
  const bar = document.getElementById('fl-filter-bar');
  const inner = document.getElementById('fl-filter-inner');
  const districts = [...new Set(cameras.map(c => c.district).filter(Boolean))].sort();
  if (!districts.length) { bar.classList.add('hidden'); return; }
  inner.innerHTML = `<button class="fl-chip${!flDistrict?' active':''}" onclick="setFlDistrict(null)">All</button>`
    + districts.map(d =>
      `<button class="fl-chip${flDistrict===d?' active':''}" onclick="setFlDistrict('${d}')">${d}</button>`
    ).join('');
  bar.classList.remove('hidden');
}
function setFlDistrict(d) { flDistrict = d; renderCameras(); buildFlFilter(allCameras.filter(c=>c.state==='fl')); }

/* ── Camera Loading ─────────────────────────────────── */
async function loadAllCameras() {
  if (!selectedStates.length) {
    allCameras = []; filteredCameras = [];
    document.getElementById('camera-grid').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">📍</div><div class="empty-state-msg">Select one or more states to load cameras</div></div>';
    document.getElementById('count-badge').textContent = '';
    document.getElementById('status-text').textContent = 'No states selected';
    document.getElementById('fl-filter-bar').classList.add('hidden');
    return;
  }
  document.getElementById('camera-grid').innerHTML = '<div class="spinner"></div>';
  document.getElementById('status-text').textContent = 'Loading…';
  try {
    const promises = selectedStates.map(s => fetchForState(s));
    const results  = await Promise.allSettled(promises);
    allCameras = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);
    const flCams = allCameras.filter(c => c.state === 'fl');
    if (flCams.length) buildFlFilter(flCams);
    else document.getElementById('fl-filter-bar').classList.add('hidden');
    filterCameras();
    document.getElementById('status-text').textContent =
      `${allCameras.length} cameras across ${selectedStates.length} state${selectedStates.length>1?'s':''}`;
    if (WEATHER_STATES.some(s => selectedStates.includes(s))) loadWeather();
  } catch(e) {
    showToast('Error loading cameras');
    document.getElementById('status-text').textContent = 'Load error';
  }
}

async function fetchForState(state) {
  if (WSDOT_STATES.includes(state))   return fetchWSDOT();
  if (FL_STATES.includes(state))       return fetchFL();
  if (IA_STATES.includes(state))       return fetchIA();
  if (IBI511_STATES.includes(state))  return fetchIBI511(state);
  return [];
}

/* ── Source Fetchers ──────────────────────────────── */
async function fetchWSDOT() {
  const r = await fetch('/api/cameras/wsdot');
  if (!r.ok) throw new Error('WSDOT failed');
  const data = await r.json();
  return (data || []).map(c => ({
    id: 'wa-' + c.CameraID,
    title: c.Title || 'WA Camera',
    road: c.RoadName || '',
    location: c.Description || '',
    lat: c.Latitude, lon: c.Longitude,
    imageUrl: c.ImageURL,
    state: 'wa', source: 'WSDOT',
    isLive: true
  }));
}

async function fetchFL() {
  const r = await fetch('/api/cameras/fl');
  if (!r.ok) throw new Error('FL failed');
  const data = await r.json();
  return (data || []).map(c => ({
    id: 'fl-' + (c.id || c.cameraId || Math.random()),
    title: c.label || c.name || 'FL Camera',
    road: c.roadway || '',
    location: c.location || '',
    lat: c.latitude, lon: c.longitude,
    imageUrl: c.imageUrl || c.url,
    district: c.district || '',
    state: 'fl', source: 'FL 511',
    isLive: true
  }));
}

async function fetchIA() {
  const r = await fetch('/api/cameras/ia');
  if (!r.ok) throw new Error('IA failed');
  const data = await r.json();
  return (data || []).map(c => ({
    id: 'ia-' + (c.id || Math.random()),
    title: c.name || 'IA Camera',
    road: c.roadway || '',
    location: c.location || '',
    lat: c.lat, lon: c.lon,
    imageUrl: c.url,
    state: 'ia', source: 'Iowa DOT',
    isLive: true
  }));
}

async function fetchIBI511(state) {
  if (!ibiKey) return [];
  const r = await fetch(`/api/cameras/ibi511?state=${state}&key=${encodeURIComponent(ibiKey)}`);
  if (!r.ok) throw new Error(`ibi511 ${state} failed`);
  const data = await r.json();
  return (data || []).map(c => ({
    id: `${state}-` + (c.id || c.cameraId || Math.random()),
    title: c.label || c.name || `${state.toUpperCase()} Camera`,
    road: c.roadway || c.road || '',
    location: c.location || c.city || '',
    lat: c.latitude || c.lat,
    lon: c.longitude || c.lon,
    imageUrl: c.imageUrl || c.url,
    state: state, source: 'ibi511',
    isLive: true
  }));
}

/* ── Filter & Render ───────────────────────────────── */
function filterCameras() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  filteredCameras = allCameras.filter(c => {
    if (flDistrict && c.state === 'fl' && c.district !== flDistrict) return false;
    if (!q) return true;
    return (c.title+c.road+c.location+c.state).toLowerCase().includes(q);
  });
  renderCameras();
}

function renderCameras() {
  const grid = document.getElementById('camera-grid');
  const badge = document.getElementById('count-badge');
  badge.textContent = filteredCameras.length
    ? `${filteredCameras.length} camera${filteredCameras.length>1?'s':''}`
    : '';
  if (!filteredCameras.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-msg">No cameras match your search</div></div>';
    return;
  }
  grid.className = 'camera-grid' + (isGridMode ? ' grid' : '');
  grid.innerHTML = filteredCameras.map((c, i) => `
    <div class="camera-card" onclick="openCamera(${i})">
      <div class="camera-thumb">
        <img src="${c.imageUrl || ''}" alt="${esc(c.title)}"
             loading="lazy" onerror="this.src=''">
        <span class="surface-badge">${c.state.toUpperCase()}</span>
      </div>
      <div class="camera-info">
        <div class="camera-source">${esc(c.source)}</div>
        <div class="camera-road">${esc(c.road||c.title)}</div>
        <div class="camera-location">${esc(c.location||c.title)}</div>
      </div>
    </div>`).join('');
}

/* ── Detail View ───────────────────────────────────── */
function openCamera(idx) {
  currentIndex = idx;
  currentCamera = filteredCameras[idx];
  if (!currentCamera) return;
  document.getElementById('tab-bar').classList.add('hidden');
  document.getElementById('toast').classList.add('detail-mode');
  showView('detail');
  populateDetail(currentCamera);
}

function populateDetail(cam) {
  document.getElementById('detail-title').textContent    = cam.title || 'Camera';
  document.getElementById('detail-road').textContent     = cam.road || '';
  document.getElementById('detail-location').textContent = cam.location || '';
  const img = document.getElementById('detail-img');
  img.src = cam.imageUrl || '';
  img.onerror = () => img.src = '';
  document.getElementById('refresh-badge').textContent   = cam.isLive ? 'Live' : 'Static';
  document.getElementById('refresh-info').textContent    = 'Auto-refreshes every 60s';
  const meta = document.getElementById('detail-meta');
  meta.innerHTML = [
    cam.state ? `<div class="meta-item"><div class="meta-label">State</div><div class="meta-value">${cam.state.toUpperCase()}</div></div>` : '',
    cam.source ? `<div class="meta-item"><div class="meta-label">Source</div><div class="meta-value">${esc(cam.source)}</div></div>` : '',
    cam.lat ? `<div class="meta-item"><div class="meta-label">Lat/Lon</div><div class="meta-value">${(+cam.lat).toFixed(4)}, ${(+cam.lon).toFixed(4)}</div></div>` : '',
  ].join('');
}

function navigateCamera(dir) {
  const next = currentIndex + dir;
  if (next < 0 || next >= filteredCameras.length) return;
  openCamera(next);
}

function refreshDetail() {
  if (!currentCamera) return;
  const img = document.getElementById('detail-img');
  const sep = currentCamera.imageUrl?.includes('?') ? '&' : '?';
  img.src = currentCamera.imageUrl + sep + '_t=' + Date.now();
  showToast('Refreshed');
}

function openFullImage() {
  if (currentCamera?.imageUrl) window.open(currentCamera.imageUrl, '_blank');
}

function copyDetailLink() {
  const url = currentCamera?.imageUrl || location.href;
  navigator.clipboard?.writeText(url).then(() => showToast('Link copied'));
}

/* ── Grid Toggle ───────────────────────────────────── */
function toggleGridMode() {
  isGridMode = !isGridMode;
  try { localStorage.setItem('gridMode', isGridMode ? '1' : '0'); } catch(e){}
  updateGridToggleUI();
  renderCameras();
}

function toggleGridPref() {
  isGridMode = !isGridMode;
  try { localStorage.setItem('gridMode', isGridMode ? '1' : '0'); } catch(e){}
  updateGridToggleUI();
  renderCameras();
}

function updateGridToggleUI() {
  const btn = document.getElementById('view-toggle-btn');
  if (btn) btn.textContent = isGridMode ? '☰' : '⊞';
  const tog = document.getElementById('grid-toggle');
  if (tog) tog.classList.toggle('on', isGridMode);
}

/* ── Settings / Keys ──────────────────────────────── */
function saveKeys() {
  const val = document.getElementById('ibi-key-input')?.value?.trim() || '';
  ibiKey = val;
  try { localStorage.setItem('ibiKey', ibiKey); } catch(e){}
  showToast('Settings saved');
  showTab('list');
  loadAllCameras();
}

function loadSettings() {
  try {
    ibiKey = localStorage.getItem('ibiKey') || '';
    isGridMode = localStorage.getItem('gridMode') === '1';
  } catch(e){ ibiKey = ''; isGridMode = false; }
  const inp = document.getElementById('ibi-key-input');
  if (inp) inp.value = ibiKey;
  updateGridToggleUI();
}

/* ── Weather / Conditions ──────────────────────────── */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function loadWeather() {
  const wxStates = selectedStates.filter(s => WEATHER_STATES.includes(s));
  if (!wxStates.length) return;
  const grid = document.getElementById('weather-grid');
  grid.innerHTML = '<div class="wx-no-data"><div class="spinner"></div></div>';
  try {
    const results = await Promise.allSettled(
      wxStates.map(s => fetch(`/api/weather/${s}`).then(r => r.ok ? r.json() : null))
    );
    const stations = results
      .filter(r => r.status === 'fulfilled' && r.value)
      .flatMap(r => Array.isArray(r.value) ? r.value : [r.value]);
    if (!stations.length) {
      grid.innerHTML = '<div class="wx-no-data">No weather data available</div>';
      return;
    }
    // Deduplicate by nearest camera (75 km radius)
    const unique = stations.slice(0, 20);
    grid.innerHTML = unique.map(s => `
      <div class="wx-card">
        <div class="wx-card-station">${esc(s.stationName || s.name || 'Station')}</div>
        <div class="wx-card-temp">${s.tempF !== undefined ? Math.round(s.tempF) + '°F' : '--'}</div>
        <div class="wx-card-desc">${esc(s.conditions || s.weather || '')}</div>
        <div class="wx-card-wind">${s.windMph !== undefined ? '💨 ' + Math.round(s.windMph) + ' mph' : ''}</div>
        <div class="wx-card-updated">${s.updated ? 'Updated ' + new Date(s.updated).toLocaleTimeString() : ''}</div>
      </div>`).join('');
  } catch(e) {
    grid.innerHTML = '<div class="wx-no-data">Weather load failed</div>';
  }
}

/* ── Toast ─────────────────────────────────────────── */
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

/* ── Utilities ─────────────────────────────────────── */
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Close dropdown on outside click ──────────────── */
document.addEventListener('click', e => {
  const wrap = document.getElementById('state-selector-wrap');
  if (dropdownOpen && wrap && !wrap.contains(e.target)) {
    document.getElementById('dropdown-panel').classList.add('hidden');
    document.getElementById('state-trigger').classList.remove('has-states');
    dropdownOpen = false;
  }
});

/* ── Search input debounce ─────────────────────────── */
let searchTimer = null;
document.addEventListener('DOMContentLoaded', () => {
  const si = document.getElementById('search-input');
  if (si) si.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(filterCameras, 200);
  });
});

/* ── Auto-refresh detail image ─────────────────────── */
setInterval(() => {
  if (activeTab === 'detail' || document.getElementById('detail-view')?.classList.contains('active')) {
    const cam = currentCamera;
    if (!cam?.imageUrl) return;
    const img = document.getElementById('detail-img');
    const sep = cam.imageUrl.includes('?') ? '&' : '?';
    img.src = cam.imageUrl + sep + '_t=' + Date.now();
  }
}, 60000);

/* ── Init ──────────────────────────────────────────── */
function init() {
  // Load persisted settings
  loadSettings();
  selectedStates = loadSelectedStates();

  // Restore ibi key input
  const inp = document.getElementById('ibi-key-input');
  if (inp && ibiKey) inp.value = ibiKey;

  // Build chips for saved states
  renderChips();

  // Start on list tab
  showTab('list');

  // If no key and no selected states, show settings first
  if (!ibiKey && !selectedStates.length) {
    showTab('settings');
    showToast('Add your API key to get started', 3000);
    return;
  }

  // Load cameras for saved states
  if (selectedStates.length) {
    loadAllCameras();
  } else {
    document.getElementById('camera-grid').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">📍</div><div class="empty-state-msg">Select one or more states to load cameras</div></div>';
    document.getElementById('status-text').textContent = 'No states selected';
  }
}

// Boot when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
